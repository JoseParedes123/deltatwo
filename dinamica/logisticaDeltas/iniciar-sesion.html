<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073486">
  <title>Iniciar sesión | Logística Delta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Logística Delta, inicio">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 9 91 83H9L50 9Z" fill="none" stroke="white" stroke-width="9" />
          <path d="m22 78 49-39M42 81l36-29M56 82l21-16" fill="none" stroke="white" stroke-width="5" />
        </svg>
      </a>
      <button class="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false">☰</button>
      <nav class="nav-links" aria-label="Navegación principal">
        <a href="index.html">INICIO</a>
        <a href="seguimiento.html">SEGUIMIENTO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="contacto.html">CONTACTO</a>
      </nav>
      <a class="nav-login" href="iniciar-sesion.html" aria-current="page">INICIAR SESIÓN</a>
      <a class="nav-login" href="registrarse.html">REGISTRARSE</a>
    </div>
  </header>
  <main class="auth-layout">
    <section class="auth-form-side">
      <form class="auth-form" data-demo-form="login">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Ingresá tus datos para acceder a tu cuenta.</p>
        <div class="input-box">
          <span class="input-icon" aria-hidden="true">＠</span>
          <input type="email" name="email" placeholder="juan.diaz@gmail.com" aria-label="Correo electrónico" required>
        </div>
        <div class="input-box">
          <span class="input-icon" aria-hidden="true">▣</span>
          <input type="password" name="password" placeholder="Contraseña" aria-label="Contraseña" required>
        </div>
        <div class="auth-options">
          <label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
          <a class="text-link" href="contacto.html">¿Olvidaste tu contraseña?</a>
        </div>
        <button class="primary-button auth-submit" type="submit">Iniciar sesión</button>
        <p class="form-feedback" role="status" aria-live="polite"></p>
        <p class="auth-switch"><a class="text-link" href="registrarse.html">¿No tenés una cuenta?</a></p>
      </form>
    </section>
    <aside class="auth-photo" aria-label="Camión de Logística Delta">
      <div class="auth-logo">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 8 92 84H8L50 8Z" fill="none" stroke="white" stroke-width="8" />
          <path d="m22 78 48-39M41 81l36-29M57 82l20-16" fill="none" stroke="white" stroke-width="5" />
        </svg>
        LOGÍSTICA DELTA
      </div>
    </aside>
  </main>
  <div data-shared-footer></div>
  <script src="app.js"></script>
</body>
</html>
