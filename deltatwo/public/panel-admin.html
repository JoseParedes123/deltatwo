<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073486">
  <title>Acceso de personal | Logística Delta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="Logística Delta, inicio"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9 91 83H9L50 9Z" fill="none" stroke="white" stroke-width="9"/><path d="m22 78 49-39M42 81l36-29M56 82l21-16" fill="none" stroke="white" stroke-width="5"/></svg></a>
      <button class="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false">☰</button>
      <nav class="nav-links" aria-label="Navegación principal"><a href="index.html">INICIO</a><a href="seguimiento.html">SEGUIMIENTO</a><a href="servicios.html">SERVICIOS</a><a href="contacto.html">CONTACTO</a></nav>
      <a class="nav-login" href="seguimiento.html">SEGUIR UN ENVÍO</a>
    </div>
  </header>
  <main class="container admin-page">
    <h1>Panel de operaciones</h1>
    <p class="lead">Actualizá el estado y la sucursal de cada paquete. El cliente verá el movimiento al consultar su código.</p>
    <section id="staff-login-panel" class="admin-panel" hidden>
      <h2>Acceso de personal</h2>
      <form id="staff-login-form" class="admin-form">
        <label>Usuario o email<input name="usuario" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Ingresar</button>
      </form>
      <p class="form-feedback" id="staff-login-feedback" role="status"></p>
    </section>
    <section id="staff-dashboard" hidden>
      <div class="admin-toolbar"><p id="staff-greeting"></p><button class="admin-logout" id="staff-logout" type="button">Cerrar sesión</button></div>
      <div class="admin-columns">
        <section class="admin-panel">
          <h2>Actualizar recorrido</h2>
          <form id="shipment-update-form" class="admin-form">
            <label>Código del envío<input name="codigo" placeholder="Ej.: ENV-0001" required></label>
            <label>Estado<select name="estado" required>
              <option value="REGISTRADO">Registrado</option><option value="RECIBIDO_DEPOSITO">Recibido en depósito</option><option value="PREPARADO">Preparado</option><option value="EN_TRANSITO">En tránsito</option><option value="EN_REPARTO">En reparto</option><option value="ENTREGADO">Entregado</option><option value="NO_ENTREGADO">No entregado</option><option value="DEVUELTO">Devuelto</option><option value="EXTRAVIADO">Extraviado</option><option value="CANCELADO">Cancelado</option>
            </select></label>
            <label>Sucursal o centro<input name="sucursal" placeholder="Ej.: Centro de distribución Córdoba" maxlength="100" required></label>
            <label>Provincia<select name="provincia" required>
              <option value="">Elegí una provincia</option><option>Ciudad Autónoma de Buenos Aires</option><option>Buenos Aires</option><option>Catamarca</option><option>Chaco</option><option>Chubut</option><option>Córdoba</option><option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option><option>Jujuy</option><option>La Pampa</option><option>La Rioja</option><option>Mendoza</option><option>Misiones</option><option>Neuquén</option><option>Río Negro</option><option>Salta</option><option>San Juan</option><option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option><option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
            </select></label>
            <label class="admin-field-wide">Detalle para el cliente<textarea name="detalle" maxlength="255" placeholder="Ej.: El paquete salió del centro de distribución rumbo a la sucursal de destino." required></textarea></label>
            <button class="primary-button admin-field-wide" type="submit">Guardar movimiento</button>
          </form>
          <p class="form-feedback" id="shipment-update-feedback" role="status"></p>
        </section>
        <section class="admin-panel">
          <h2>Envíos recientes</h2>
          <p class="admin-hint">Seleccioná un envío para completar su código.</p>
          <div id="admin-shipment-list" class="admin-shipment-list" aria-live="polite"></div>
        </section>
      </div>
    </section>
  </main>
  <div data-shared-footer></div>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
