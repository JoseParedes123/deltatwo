<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073486">
  <title>Mis envíos | Logística Delta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="container nav">
    <a class="brand" href="index.html" aria-label="Logística Delta, inicio"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9 91 83H9L50 9Z" fill="none" stroke="white" stroke-width="9"/><path d="m22 78 49-39M42 81l36-29M56 82l21-16" fill="none" stroke="white" stroke-width="5"/></svg></a>
    <nav class="nav-links" aria-label="Navegación principal"><a href="index.html">INICIO</a><a href="seguimiento.html">SEGUIMIENTO</a><a href="servicios.html">SERVICIOS</a><a href="contacto.html">CONTACTO</a></nav>
    <button class="nav-login" type="button" data-logout>CERRAR SESIÓN</button>
  </div></header>
  <main class="container account-page">
    <div class="ribbon-title"><h1>Mis envíos</h1></div>
    <p class="page-intro" id="account-greeting">Consultando tu cuenta…</p>
    <section class="account-request" aria-labelledby="request-title">
      <h2 id="request-title">Solicitar un envío</h2>
      <p>Por ahora trabajamos con las zonas disponibles de Argentina. Completá los datos para registrar tu solicitud.</p>
      <form id="request-shipment-form" class="shipment-request-form">
        <label>Nombre del remitente<input name="remitente" autocomplete="name" required maxlength="120"></label>
        <label>Origen · localidad y provincia<input name="origen" placeholder="CABA, Buenos Aires" required maxlength="200"></label>
        <label>Nombre del destinatario<input name="destinatario" required maxlength="120"></label>
        <label>Destino · localidad y provincia<input name="destino" placeholder="CABA, Buenos Aires" required maxlength="200"></label>
        <label>Teléfono de contacto<input name="telefono" type="tel" maxlength="30"></label>
        <label>Zona de entrega<select name="zona" id="request-zone" required><option value="">Cargando zonas…</option></select></label>
        <label>Descripción del paquete<input name="descripcion" required maxlength="255"></label>
        <label>Peso (kg)<input name="peso" type="number" min="0.1" max="3000" step="0.1" required></label>
        <label class="request-check"><input name="fragil" type="checkbox"> Paquete frágil</label>
        <button class="primary-button" type="submit">Solicitar envío</button>
        <p class="form-feedback" id="request-feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
    <div id="customer-shipments" class="customer-shipments" aria-live="polite"></div>
    <p class="account-track-link"><a class="primary-button" href="seguimiento.html">Seguir un envío sin iniciar sesión</a></p>
  </main>
  <div data-shared-footer></div>
  <script src="js/app.js"></script>
</body>
</html>
